<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="日常記帳"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>日常記帳</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#20241f;--muted:#858980;--green:#33745a;--line:#eeeee9;--red:#c65d4f;--shadow:0 8px 26px #2633230c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100dvh;margin:auto;padding:22px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:14px;color:var(--muted);letter-spacing:.08em}.brand strong{display:block;color:var(--ink);font-size:22px;letter-spacing:0;margin-top:4px}.iconbtn{border:0;background:var(--card);width:42px;height:42px;border-radius:15px;box-shadow:var(--shadow);font-size:18px}.monthrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.monthrow button{border:0;background:none;font-size:20px;color:var(--muted);padding:8px 13px}.monthlabel{font-weight:650;font-size:16px}.summary{background:#244b3b;border-radius:26px;padding:23px 22px;color:#fff;box-shadow:0 12px 30px #244b3b22}.sumtitle{font-size:13px;color:#d0ded6}.balance{font-size:34px;font-weight:700;margin:7px 0 20px;letter-spacing:-.03em}.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sumitem{border-top:1px solid #ffffff35;padding-top:12px}.sumitem span{display:block;color:#c8d8cf;font-size:12px;margin-bottom:5px}.sumitem b{font-size:17px}.switcher{display:flex;background:#eae9e3;border-radius:14px;padding:4px;margin:22px 0 16px}.switcher button{border:0;background:transparent;border-radius:11px;flex:1;padding:10px;color:var(--muted);font-weight:600}.switcher button.active{background:white;color:var(--ink);box-shadow:0 2px 8px #0000000b}.listhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.listhead h2{font-size:17px;margin:0}.listhead span{font-size:12px;color:var(--muted)}.transactions{display:flex;flex-direction:column;gap:9px}.row{display:flex;align-items:center;background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);gap:12px}.emoji{height:43px;width:43px;border-radius:15px;background:#f4f3ee;display:grid;place-items:center;font-size:21px}.rowmain{flex:1;min-width:0}.rowtitle{font-weight:600;font-size:14px}.rowmeta{font-size:11px;color:var(--muted);margin-top:5px}.amount{font-weight:700;font-size:14px;white-space:nowrap}.amount.expense{color:var(--ink)}.amount.income{color:var(--green)}.empty{text-align:center;color:var(--muted);padding:42px 10px;font-size:14px}.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;background:#244b3b;color:white;border-radius:18px;padding:15px 25px;font-size:15px;font-weight:650;box-shadow:0 9px 24px #244b3b40;white-space:nowrap}.overlay{position:fixed;inset:0;background:#151a1680;display:none;align-items:flex-end;justify-content:center;z-index:5}.overlay.open{display:flex}.sheet{width:min(520px,100%);background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheethead h2{margin:0;font-size:19px}.close{border:0;background:#e9e8e2;border-radius:50%;width:34px;height:34px;font-size:18px}.typepick{display:flex;gap:9px;margin-bottom:18px}.typepick button{flex:1;border:1px solid var(--line);background:white;border-radius:13px;padding:11px;color:var(--muted);font-weight:600}.typepick button.active{border-color:var(--green);color:var(--green);background:#eef5f0}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px 2px}.field input,.field select{width:100%;border:1px solid #e8e8e1;background:white;border-radius:13px;padding:13px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#78a18b}.save{width:100%;border:0;background:#244b3b;color:white;border-radius:15px;padding:15px;font-weight:700;margin-top:10px}.actions{display:flex;gap:9px}.actions button{flex:1;padding:12px;border:0;border-radius:13px;background:#fff;color:var(--ink);font-size:13px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#20241f;color:white;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(min-width:600px){body{padding-top:20px}.app{padding-top:26px}}
</style></head><body>
<main class="app"><header class="top"><div class="brand">讓日子更有掌握<strong>日常記帳</strong></div><button class="iconbtn" id="more" aria-label="資料管理">⋯</button></header><div class="monthrow"><button id="prev">‹</button><div class="monthlabel" id="monthLabel"></div><button id="next">›</button></div><section class="summary"><div class="sumtitle">本月結餘</div><div class="balance" id="balance">$0</div><div class="sumgrid"><div class="sumitem"><span>收入</span><b id="income">$0</b></div><div class="sumitem"><span>支出</span><b id="expense">$0</b></div></div></section><div class="switcher"><button class="active" data-filter="all">全部</button><button data-filter="expense">支出</button><button data-filter="income">收入</button></div><div class="listhead"><h2>收支紀錄</h2><span id="count"></span></div><section class="transactions" id="transactions"></section></main><button class="fab" id="add">＋ 新增紀錄</button>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheethead"><h2>新增紀錄</h2><button class="close" id="close">×</button></div><div class="typepick"><button class="active" data-type="expense">支出</button><button data-type="income">收入</button></div><form id="form"><div class="field"><label for="amountInput">金額</label><input id="amountInput" type="number" min="1" step="1" placeholder="輸入金額" required inputmode="decimal"></div><div class="field"><label for="category">類別</label><select id="category"></select></div><div class="field"><label for="note">備註（選填）</label><input id="note" maxlength="40" placeholder="例如：午餐、捷運"></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div><button class="save">儲存紀錄</button></form></section></div><div class="toast" id="toast"></div>
<script>
const KEY='daily-ledger-v1', cats={expense:[['🍜','餐飲'],['🚇','交通'],['🛍️','購物'],['🏠','居家'],['🎮','娛樂'],['💊','醫療'],['📚','學習'],['✦','其他']],income:[['💼','薪水'],['🎁','獎金'],['📈','投資'],['🧾','接案'],['✦','其他']]};let records=JSON.parse(localStorage.getItem(KEY)||'[]'),view=new Date(),filter='all',type='expense';const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0}).format(n);function persist(){localStorage.setItem(KEY,JSON.stringify(records))}function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function render(){let m=ym(view),items=records.filter(x=>x.date.slice(0,7)===m),inc=items.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=items.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);$('#monthLabel').textContent=`${view.getFullYear()} 年 ${view.getMonth()+1} 月`; $('#balance').textContent='$'+money(inc-exp);$('#income').textContent='$'+money(inc);$('#expense').textContent='$'+money(exp);let shown=items.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);$('#count').textContent=`${shown.length} 筆`;$('#transactions').innerHTML=shown.length?shown.map(x=>{let c=(cats[x.type].find(y=>y[1]===x.category)||['✦'])[0];return `<article class="row"><div class="emoji">${c}</div><div class="rowmain"><div class="rowtitle">${esc(x.category)}${x.note?` · ${esc(x.note)}`:''}</div><div class="rowmeta">${x.date.replaceAll('-',' / ')}</div></div><div class="amount ${x.type}">${x.type==='income'?'+':'−'}$${money(x.amount)}</div></article>`}).join(''):'<div class="empty">這個月還沒有紀錄<br>點下方按鈕，記下第一筆收支</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(){ $('#category').innerHTML=cats[type].map(c=>`<option>${c[1]}</option>`).join('');document.querySelectorAll('.typepick button').forEach(b=>b.classList.toggle('active',b.dataset.type===type))}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.switcher button').forEach(c=>c.classList.toggle('active',c===b));render()});$('#add').onclick=()=>{$('#date').value=new Date().toLocaleDateString('en-CA');$('#amountInput').value='';$('#note').value='';options();$('#overlay').classList.add('open');setTimeout(()=>$('#amountInput').focus(),100)};$('#close').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('open')};document.querySelectorAll('.typepick button').forEach(b=>b.onclick=()=>{type=b.dataset.type;options()});$('#form').onsubmit=e=>{e.preventDefault();records.push({id:crypto.randomUUID(),type,amount:Number($('#amountInput').value),category:$('#category').value,note:$('#note').value.trim(),date:$('#date').value,created:Date.now()});persist();view=new Date($('#date').value+'T12:00:00');$('#overlay').classList.remove('open');render();toast('已儲存')};$('#more').onclick=()=>{let choice=prompt('資料管理：輸入 E 匯出備份，輸入 I 匯入備份，輸入 C 清除全部資料');if(!choice)return;choice=choice.toLowerCase();if(choice==='e'){let blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='日常記帳備份.json';a.click();URL.revokeObjectURL(a.href)}else if(choice==='i'){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v))throw 0;records=v;persist();render();toast('備份已匯入')}catch{toast('檔案格式不正確')}};r.readAsText(f)};i.click()}else if(choice==='c'&&confirm('確定清除所有記帳資料？此操作無法復原。')){records=[];persist();render();toast('資料已清除')}};render();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>
